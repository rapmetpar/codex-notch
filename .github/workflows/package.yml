name: Package manual release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-release-package
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'rapmetpar/codex-notch' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source and toolchain
        run: |
          git rev-parse HEAD
          sw_vers
          xcodebuild -version
          swift --version
          test "$(uname -m)" = arm64
      - name: Verify contracts, tests, and app bundle
        run: ./scripts/verify.sh
      - name: Package and verify manual release
        env:
          RUN_TESTS: '0'
        run: |
          ./scripts/release.sh
          git rev-parse HEAD > dist.noindex/source-commit.txt
      - name: Upload verified release files
        uses: actions/upload-artifact@v4
        with:
          name: manual-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist.noindex/*.zip
            dist.noindex/*.dmg
            dist.noindex/*.sha256
            dist.noindex/source-commit.txt
